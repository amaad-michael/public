---
# ---------------------------------------------------------------------------
# ci.yml — hardened, reusable CI template.
#
# Drop into any new repo at .github/workflows/ci.yml alongside dependabot.yml.
# Pairs with a .pre-commit-config.yaml in the repo root (the lint job runs it).
#
# Security properties (why this is stricter than a typical template):
#  1. Every third-party action is pinned to a full commit SHA, not a mutable
#     tag. A tag like @v4 can be moved by the action owner; a SHA cannot.
#     Dependabot (dependabot.yml, github-actions ecosystem) keeps pins fresh.
#  2. Least-privilege permissions: top-level `permissions: {}` denies
#     everything, then each job grants only what it needs (contents: read).
#     A compromised action therefore gets no token scopes to abuse.
#  3. No `pull_request_target` trigger (it runs untrusted fork code with a
#     privileged token). `pull_request` is the safe trigger for fork PRs.
#  4. No `${{ ... }}` interpolation inside `run:` blocks. Expression contexts
#     are attacker-controlled in PRs and enable script injection; values cross
#     into scripts via `env:` instead (see the test-job example below).
#  5. step-security/harden-runner in `audit` mode on every job: monitors
#     egress so a compromised step phoning home shows up in the logs.
#     (Switch to `block` for maximum strictness once you know a repo's
#     network needs — block breaks builds that need unexpected egress.)
#  6. Concurrency cancels superseded runs: no stale queued jobs executing
#     after a force-push replaces them.
# ---------------------------------------------------------------------------

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # manual runs only; safe, no untrusted input

permissions: {}  # deny-all default; jobs below grant their own

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # job only reads; no token left in git config

      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit

      # The markdownlint pre-commit hook is mdl, a Ruby tool, and
      # the runner image no longer ships a system Ruby (PR #87's
      # Lint run, 2026-10-29). Ruby 3.3 is the supported line mdl
      # 0.13.0's dependencies run on unchanged; 3.2 is past
      # upstream end of life.
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f  # v1.335.0
        with:
          ruby-version: '3.3'

      # The pre-commit steps below run explicitly instead of via
      # pre-commit/action: the action restores this cache and runs
      # pre-commit inside its own step, so no workflow step can
      # clear the cache between the restore and the run, which is
      # the order the next step needs. Same cache path and key the
      # action used.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}

      # A cached Ruby hook environment carries the absolute path
      # of the Ruby that built it, and pre-commit reuses the cache
      # without checking that interpreter still exists: the
      # restored mdl environment still points at the runner's old
      # /usr/bin/ruby3.2, which is why PRs #88 and #90 failed even
      # with setup-ruby installed and working. Deleting the cached
      # Ruby environments forces a rebuild against the Ruby above.
      - name: Clear stale pre-commit Ruby environments
        run: find "$HOME/.cache/pre-commit" -maxdepth 2 -type d -name 'rbenv-*' -exec rm -rf {} + 2>/dev/null || true

      - name: Install pre-commit
        run: python -m pip install pre-commit==4.7.0

      - name: Run pre-commit
        run: pre-commit run --show-diff-on-failure --color=always --all-files

  # -----------------------------------------------------------------------
  # Add this repo's real test job here. Secure pattern below — note the
  # branch/PR values travel via `env:`, never interpolated into `run:`.
  #
  #   test:
  #     name: Test
  #     runs-on: ubuntu-latest
  #     permissions:
  #       contents: read
  #     steps:
  #       # v7.0.1
  #       - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
  #         with:
  #           persist-credentials: false
  #
  #       # v2.21.1
  #       - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2
  #         with:
  #           egress-policy: audit
  #
  #       - name: Run tests
  #         env:
  #           REF: ${{ github.ref }}
  #         run: |
  #           echo "testing ref $REF"
  #           make test
  # -----------------------------------------------------------------------

  security:
    name: Security scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # job only reads; no token left in git config

      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'  # fail the job on HIGH/CRITICAL findings
