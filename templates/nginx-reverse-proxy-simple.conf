# nginx template — minimal single-backend reverse proxy
#
# Sanitized template built from production configs (2026-11-19); every
# site-specific value is a placeholder. The production pattern this
# preserves is the small one: a single location, only the Host header set,
# proxying to a backend known by name. Replace the server_name and the
# backend host before use. Install as a .conf file in /etc/nginx/conf.d/
# (RHEL family) or /etc/nginx/sites-available/ (Debian family), then test
# with nginx -t and reload.

server {
    # Keeping a listen directive will route *all* traffic to the
    # specified IP to the specified server as a default.
    # listen 203.0.113.1:80;
    listen *:80;

    server_name example.org www.example.org;

    # Optional: block abusive source addresses.
    # deny 203.0.113.50;
    # deny 203.0.113.51;

    location / {
        proxy_set_header Host $host;
        proxy_pass http://backend-01;
    }
}
