# Apache VirtualHost template — application with data directories
#
# Sanitized template built from production configs (2026-11-19); every
# site-specific value is a placeholder. Replace example.com, the admin
# address, and the paths before use. The application serves its web root
# plus separate data directories, each with its own Directory block, and
# keeps per-site logs. Install as a .conf file in /etc/httpd/conf.d/
# (RHEL family) or /etc/apache2/sites-available/ (Debian family), then
# reload Apache.

<VirtualHost *:80>
    ServerAdmin webmaster@example.com
    DocumentRoot /var/www/example.com/prod/web
    ServerName app.example.com
    KeepAlive on
    SetEnv CONFIG PROD

    CustomLog /var/log/httpd/app_example_access.log combined
    ErrorLog /var/log/httpd/app_example_error.log
    LogLevel debug

    # Primary web root
    <Directory "/var/www/example.com/prod/web">
        Options -Indexes
        Require all granted
        Satisfy Any
        AllowOverride All
        AcceptPathInfo on
    </Directory>

    # Additional data directories the application serves from
    <Directory "/var/www/example.com/data/one">
        Options -Indexes
        Require all granted
        Satisfy Any
        AllowOverride All
        AcceptPathInfo on
    </Directory>

    <Directory "/var/www/example.com/data/two">
        Options -Indexes
        Require all granted
        Satisfy Any
        AllowOverride All
        AcceptPathInfo on
    </Directory>

    # Optional: reverse-proxy one path to another service.
    # ProxyPass /reports http://backend.example.com/reports
    # ProxyPassReverse /reports http://backend.example.com/reports
</VirtualHost>
