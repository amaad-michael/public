# nginx template — SSL-terminating reverse proxy with an upstream pool
#
# Sanitized template built from production configs (2026-11-19); every
# site-specific value is a placeholder. Backend addresses use the
# 203.0.113.0/24 documentation range (TEST-NET-3). Replace the server_name,
# the certificate paths, and the backend addresses before use. Install as
# a .conf file in /etc/nginx/conf.d/ (RHEL family) or
# /etc/nginx/sites-available/ (Debian family), then test with nginx -t
# and reload.
#
# Changes from the 2021-era original, made so the template loads on a
# current nginx: the deprecated "ssl on;" line is dropped (the ssl
# parameter on the listen directive does that job), and the protocol list
# is TLSv1.2 and TLSv1.3 only. The cipher suite below is the original's,
# kept for reference; review it before production use.

upstream backend_pool {
    server 203.0.113.10;
    server 203.0.113.11;
}

server {
    # Keeping a listen directive will route *all* traffic to the
    # specified IP to the specified server as a default.
    listen 80;
    listen 443 ssl;
    server_name example.com www.example.com;

    ssl_certificate /etc/nginx/ssl/example.com/server.crt;
    ssl_certificate_key /etc/nginx/ssl/example.com/server.key;
    ssl_trusted_certificate /etc/nginx/ssl/example.com/ca-certs.pem;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 10m;
    ssl_prefer_server_ciphers on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDH+AESGCM:DH+AESGCM:ECDH+AES256:DH+AES256:ECDH+AES128:DH+AES:ECDH+3DES:DH+3DES:RSA+AESGCM:RSA+AES:RSA+3DES:!aNULL:!MD5:!DSS;
    # add_header Strict-Transport-Security "max-age=31536000";

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://203.0.113.10:80;
    }

    location /app-one {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://203.0.113.11:80;
    }
}
