# Apache VirtualHost template — PHP application (Moodle-style)
#
# Sanitized template built from production configs (2026-11-19); every
# site-specific value is a placeholder. Replace example.com, the admin
# address, and the DocumentRoot path before use. Install as a .conf file
# in /etc/httpd/conf.d/ (RHEL family) or /etc/apache2/sites-available/
# (Debian family), then reload Apache.

<VirtualHost *:80>
    ServerAdmin webmaster@example.com
    DocumentRoot /var/www/example.com/app
    ServerName example.com
    DirectoryIndex index.php index.html
    ServerAlias www.example.com
    KeepAlive on

    <Directory "/var/www/example.com/app">
        Options -Indexes
        AllowOverride All
        Require all granted
        Satisfy Any
        AcceptPathInfo on
    </Directory>
</VirtualHost>
