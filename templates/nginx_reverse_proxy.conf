# nginx template — reverse proxy with per-path backends
#
# Sanitized template built from production configs (2026-11-19); every
# site-specific value is a placeholder. Backend addresses use the
# 203.0.113.0/24 documentation range (TEST-NET-3). Replace the server_name
# and the backend addresses before use. Install as a .conf file in
# /etc/nginx/conf.d/ (RHEL family) or /etc/nginx/sites-available/
# (Debian family), then test with nginx -t and reload.
#
# The production pattern this preserves: one server block fronts several
# applications, and each location path is proxied to the backend that
# serves it. Every location repeats the same four proxy_set_header lines.

server {
    # Keeping a listen directive will route *all* traffic to the
    # specified IP to the specified server as a default.
    # listen 203.0.113.1:80;
    listen 80;
    server_name example.com www.example.com;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://203.0.113.10:80;
    }

    location /app-one {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://203.0.113.11:80;
    }

    location /app-two {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://203.0.113.11:80;
    }
}
