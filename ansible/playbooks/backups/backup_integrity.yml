---
# backup_integrity.yml — Ansible form of backup integrity checking.
#
# Primary bash form: scripts/backups/backup_integrity_tool_v1.sh
#   generate: find . -type f ! -name "manifest-*.sha256" -print0 |
#             xargs -0 sha256sum > manifest-YYYYMM.sha256
#   verify:   sha256sum --quiet -c <most recent manifest-*.sha256>
# (usage guide: scripts/backups/backup_integrity_tool_guide-v1.md)
#
# A second bash implementation exists in
# scripts/monitoring/local_backups_checker.sh — a different interface
# (--generate/--verify, a single backup.manifest name, hand-rolled
# verification loop, verify_*.log files). This playbook follows the
# primary tool only; manifests from the two bash tools are the same
# sha256sum format, but their file naming differs.
#
# Byte compatibility is the design constraint: the manifest this
# playbook generates is produced by the identical find/sha256sum
# pipeline, run in the identical working directory state, as the bash
# tool — so a manifest written by either form verifies under the
# other (sha256sum -c), and on an unchanged tree the generated bytes
# are identical. Generation here is also idempotent in the Ansible
# sense: the new manifest is built to a temp file and only replaces
# the existing manifest when its bytes differ, so a second run on an
# unchanged tree reports no change.
#
# Usage:
#   cd ansible
#   ansible-playbook -i hosts playbooks/backups/backup_integrity.yml \
#     -l pi1 -e backup_integrity_target=/mnt/backup/infrastructure
#   ansible-playbook -i hosts playbooks/backups/backup_integrity.yml \
#     -l pi1 -e backup_integrity_target=/mnt/backup/infrastructure \
#     -e backup_integrity_action=verify
#
# Extra vars:
#   backup_integrity_target   (required) directory on the target host
#   backup_integrity_action   generate (default) | verify

- name: Backup integrity — generate or verify a SHA-256 manifest
  hosts: all
  gather_facts: false

  vars:
    backup_integrity_target: ""
    backup_integrity_action: generate

  tasks:
    - name: Require a target directory and a valid action
      ansible.builtin.assert:
        that:
          - backup_integrity_target | length > 0
          - backup_integrity_action in ['generate', 'verify']
        fail_msg: "Set -e backup_integrity_target=/path and optionally -e backup_integrity_action=generate|verify"

    - name: Require the target to be an existing directory
      ansible.builtin.stat:
        path: "{{ backup_integrity_target }}"
      register: backup_integrity_target_stat
      failed_when: not (backup_integrity_target_stat.stat.isdir | default(false))

    - name: Generate the manifest (identical pipeline to the bash tool)
      ansible.builtin.shell: |
        set -euo pipefail
        cd "{{ backup_integrity_target }}"
        DATE_TAG=$(date +%Y%m)
        MANIFEST="manifest-${DATE_TAG}.sha256"
        TMP_MANIFEST=$(mktemp ./.manifest-tmp.XXXXXX)
        trap 'rm -f "$TMP_MANIFEST"' EXIT
        find . -type f ! -name "manifest-*.sha256" ! -name ".manifest-tmp.*" -print0 | xargs -0 sha256sum > "$TMP_MANIFEST"
        if [ -f "$MANIFEST" ] && cmp -s "$TMP_MANIFEST" "$MANIFEST"; then
          echo "MANIFEST_UNCHANGED $MANIFEST"
        else
          mv "$TMP_MANIFEST" "$MANIFEST"
          trap - EXIT
          echo "MANIFEST_WRITTEN $MANIFEST"
        fi
        echo "INFO: Manifest $MANIFEST for {{ backup_integrity_target }} ($(wc -l < "$MANIFEST") entries)"
      args:
        executable: /bin/bash
      register: backup_integrity_generate
      changed_when: "'MANIFEST_WRITTEN' in backup_integrity_generate.stdout"
      when: backup_integrity_action == 'generate'

    - name: Show the generate result
      ansible.builtin.debug:
        var: backup_integrity_generate.stdout_lines
      when: backup_integrity_action == 'generate'

    - name: Locate and verify against the most recent manifest
      ansible.builtin.shell: |
        set -uo pipefail
        cd "{{ backup_integrity_target }}"
        MANIFEST=$(find . -maxdepth 1 -name "manifest-*.sha256" | sort -r | head -n 1)
        if [ -z "$MANIFEST" ]; then
          echo "FATAL: No manifest-*.sha256 found in {{ backup_integrity_target }}." >&2
          exit 1
        fi
        echo "INFO: Executing integrity check against $MANIFEST..."
        if sha256sum --quiet -c "$MANIFEST"; then
          echo "SUCCESS: Cryptographic integrity check passed. No silent corruption detected."
        else
          echo "FATAL: Integrity check failed. Delta drift or corruption detected." >&2
          exit 1
        fi
      args:
        executable: /bin/bash
      register: backup_integrity_verify
      changed_when: false
      failed_when: false
      when: backup_integrity_action == 'verify'

    - name: Show the verify result
      ansible.builtin.debug:
        var: backup_integrity_verify.stdout_lines
      when: backup_integrity_action == 'verify'

    - name: Fail the play when verification failed
      ansible.builtin.fail:
        msg: "Backup integrity verification FAILED on {{ inventory_hostname }} for {{ backup_integrity_target }} (see output above)."
      when:
        - backup_integrity_action == 'verify'
        - backup_integrity_verify.rc != 0
