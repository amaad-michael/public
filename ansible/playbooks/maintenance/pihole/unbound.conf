server:
    # --- System & Network ---
    chroot: ""
    interface: 127.0.0.1
    port: 5335
    # Strict access control for localhost only
    access-control: 127.0.0.1 allow
    interface-automatic: no

    # --- Protocols ---
    do-ip4: yes
    do-udp: yes
    do-tcp: yes
    # Disabled per your personalized settings (prevents timeouts on non-IPv6 nets)
    do-ip6: no
    prefer-ip6: no

    # --- Logging ---
    # Minimized logging for privacy and SSD health
    use-syslog: yes
    verbosity: 1
    log-queries: no
    log-replies: no
    log-servfail: no
    log-local-actions: no

    # --- Privacy & Hardening ---
    hide-identity: yes
    hide-version: yes
    # QNAME minimisation improves privacy by sending minimal info to upstream nameservers
    qname-minimisation: yes
    minimal-responses: yes
    rrset-roundrobin: yes
    # Use 0x20-encoded random bits in the query to foil spoof attempts
    use-caps-for-id: yes

    # Essential Security (Retained from Default)
    harden-glue: yes
    harden-dnssec-stripped: yes

    # --- Performance Tuning (Personalized) ---
    # Threads set to 1 for standard Pi-hole/Cloud setups
    num-threads: 1
    # Increased buffer sizes to prevent packet loss during spikes
    so-rcvbuf: 3145728
    so-sndbuf: 3145728

    # EDNS & Fragmentation
    # Both set to 1232 to prevent IP fragmentation (DNS Flag Day recommendation)
    edns-buffer-size: 1232
    max-udp-size: 1232

    # Limits
    ratelimit: 1200
    ip-ratelimit: 0
    unwanted-reply-threshold: 10000000
    outgoing-range: 1024
    outgoing-num-tcp: 100
    num-queries-per-thread: 512

    # --- Caching & Slabs ---
    prefetch: yes
    prefetch-key: yes
    cache-min-ttl: 0
    cache-max-ttl: 86400
    cache-max-negative-ttl: 3600
    # Slabs reduce lock contention
    msg-cache-slabs: 4
    rrset-cache-slabs: 4
    infra-cache-slabs: 4
    key-cache-slabs: 4

    # --- Private Address Ranges (DNS Rebinding Protection) ---
    # Keeps upstream DNS servers from returning private IPs
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: 172.16.0.0/12
    private-address: 10.0.0.0/8
    private-address: fd00::/8
    private-address: fe80::/10
    private-address: 192.0.2.0/24
    private-address: 198.51.100.0/24
    private-address: 203.0.113.0/24
    private-address: 255.255.255.255/32
