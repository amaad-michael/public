# ============================================================
#
# FILE    : inventory.ini
# PURPOSE : Define target Proxmox hosts for all playbooks
#
# REQUIREMENTS PER HOST:
#   - Debian-based OS (Debian 11/12, Ubuntu 22.04/24.04)
#   - Static IP configured before running install_proxmox.yml
#   - SSH key-based access to a root or sudo user
#   - FQDN as the hostname (e.g. pve01.home.lab)
#     Add to /etc/hosts if not resolvable via DNS:
#     192.168.1.10  pve01.home.lab pve01
# ============================================================

[proxmox_targets]
pve01.home.lab ansible_host=192.168.1.10 ansible_user=your_sudo_user
# pve02.home.lab ansible_host=192.168.1.11 ansible_user=your_sudo_user

[proxmox_targets:vars]
ansible_python_interpreter=/usr/bin/python3
