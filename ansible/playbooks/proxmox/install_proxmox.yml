---
# ============================================================
# PROJECT : Proxmox VE Homelab Automation
# AUTHOR  : Michael Tatum (HarborSonar)
# REPO    : michaeltatum.xyz
# UPDATED : 2025-03-14
# ============================================================
#
# FILE    : install_proxmox.yml
# STEP    : 1 of 5
# PURPOSE : Install Proxmox VE on any Debian-based host
#           (Debian 11/12, Ubuntu 22.04/24.04 — auto-detected)
#
# RUN     : ansible-playbook -i inventory.ini install_proxmox.yml --ask-become-pass
#
# WHAT IT DOES:
#   - Verifies Debian-based OS (fails fast otherwise)
#   - Adds PVE no-subscription repo, removes enterprise repo
#   - Installs Proxmox VE kernel + packages
#   - Configures vmbr0 network bridge
#   - Hardens SSH
#   - Creates ansible@pam user + API token
#   - Reboots into PVE kernel
#
# REQUIREMENTS:
#   - Target host must be Debian-based
#   - Root or sudo SSH access
#   - Static IP already configured (Proxmox requirement)
#   - FQDN resolvable on target host (/etc/hosts if needed)
#
# NEXT    : configure_proxmox.yml (run after reboot)
# ============================================================

- name: Install and configure Proxmox VE
  hosts: proxmox_targets
  become: true
  gather_facts: true

  vars:
    # Network bridge config — adjust to match your NIC
    pve_bridge_iface: "{{ ansible_default_ipv4.interface }}"
    pve_bridge_name: vmbr0
    pve_bridge_ip: "{{ ansible_default_ipv4.address }}"
    pve_bridge_prefix: "{{ ansible_default_ipv4.prefix }}"
    pve_bridge_gateway: "{{ ansible_default_ipv4.gateway }}"
    pve_bridge_dns: "1.1.1.1 8.8.8.8"  # override via -e if needed

    # Proxmox API token for Ansible (created post-install)
    pve_api_user: ansible@pam
    pve_api_token_name: ansible-token

    # SSH hardening
    ssh_permit_root_login: "no"
    ssh_password_auth: "no"
    ssh_port: 22

  pre_tasks:
    - name: Verify target is Debian-based
      ansible.builtin.fail:
        msg: "This playbook only supports Debian-based systems. Detected: {{ ansible_distribution }}"
      when: ansible_os_family != "Debian"

    - name: Show detected OS
      ansible.builtin.debug:
        msg: "Detected {{ ansible_distribution }} {{ ansible_distribution_version }} ({{ ansible_distribution_release }})"

    - name: Verify static IP is set (no DHCP lease file)
      ansible.builtin.stat:
        path: /var/lib/dhcp/dhclient.{{ pve_bridge_iface }}.leases
      register: dhcp_lease
      changed_when: false

    - name: Warn if DHCP lease detected
      ansible.builtin.debug:
        msg: >
          WARNING: DHCP lease file detected for {{ pve_bridge_iface }}.
          Proxmox requires a static IP. Proceeding, but configure a static IP before rebooting.
      when: dhcp_lease.stat.exists

  tasks:

    # -------------------------------------------------------------------------
    # 1. System prep
    # -------------------------------------------------------------------------
    - name: Set hostname to FQDN
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Ensure /etc/hosts has FQDN entry
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: "^{{ pve_bridge_ip }}"
        line: "{{ pve_bridge_ip }} {{ inventory_hostname }} {{ inventory_hostname.split('.')[0] }}"
        state: present

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - curl
          - gnupg
          - ca-certificates
          - ifupdown
          - bridge-utils
          - python3
          - python3-pip
        state: present

    # -------------------------------------------------------------------------
    # 2. Proxmox repo setup (version-aware)
    # -------------------------------------------------------------------------
    - name: Set Proxmox repo codename (Debian)
      ansible.builtin.set_fact:
        pve_repo_codename: "{{ ansible_distribution_release }}"
      when: ansible_distribution == "Debian"

    # Ubuntu uses Debian base — map Ubuntu release to closest Debian codename
    - name: Set Proxmox repo codename (Ubuntu → Debian mapping)
      ansible.builtin.set_fact:
        pve_repo_codename: "{{ 'bookworm' if ansible_distribution_version is version('23', '>=') else 'bullseye' }}"
      when: ansible_distribution == "Ubuntu"

    - name: Add Proxmox GPG key
      ansible.builtin.get_url:
        url: https://enterprise.proxmox.com/debian/proxmox-release-{{ pve_repo_codename }}.gpg
        dest: /etc/apt/trusted.gpg.d/proxmox-release-{{ pve_repo_codename }}.gpg
        mode: '0644'

    - name: Add Proxmox no-subscription repo
      ansible.builtin.apt_repository:
        repo: "deb http://download.proxmox.com/debian/pve {{ pve_repo_codename }} pve-no-subscription"
        state: present
        filename: pve-no-subscription

    - name: Remove enterprise repo if present
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/pve-enterprise.list
        state: absent

    - name: Update apt cache after adding PVE repo
      ansible.builtin.apt:
        update_cache: true

    # -------------------------------------------------------------------------
    # 3. Install Proxmox VE
    # -------------------------------------------------------------------------
    - name: Install Proxmox VE kernel
      ansible.builtin.apt:
        name: proxmox-default-kernel
        state: present
      register: pve_kernel_installed

    - name: Install Proxmox VE packages
      ansible.builtin.apt:
        name:
          - proxmox-ve
          - postfix
          - open-iscsi
          - chrony
        state: present
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Remove os-prober (interferes with PVE grub)
      ansible.builtin.apt:
        name: os-prober
        state: absent

    - name: Remove old Debian/Ubuntu kernels
      ansible.builtin.shell: |
        dpkg --list | grep 'linux-image' | grep -v proxmox | awk '{print $2}' | xargs apt-get -y purge || true
      changed_when: false

    # -------------------------------------------------------------------------
    # 4. Network bridge (vmbr0)
    # -------------------------------------------------------------------------
    - name: Deploy /etc/network/interfaces with vmbr0
      ansible.builtin.template:
        src: templates/interfaces.j2
        dest: /etc/network/interfaces
        owner: root
        group: root
        mode: '0644'
        backup: true

    # -------------------------------------------------------------------------
    # 5. SSH hardening
    # -------------------------------------------------------------------------
    - name: Harden SSH configuration
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
        validate: /usr/sbin/sshd -t -f %s
      loop:
        - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin {{ ssh_permit_root_login }}' }
        - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication {{ ssh_password_auth }}' }
        - { regexp: '^#?Port ', line: 'Port {{ ssh_port }}' }
        - { regexp: '^#?X11Forwarding', line: 'X11Forwarding no' }
        - { regexp: '^#?MaxAuthTries', line: 'MaxAuthTries 3' }
        - { regexp: '^#?ClientAliveInterval', line: 'ClientAliveInterval 300' }
        - { regexp: '^#?ClientAliveCountMax', line: 'ClientAliveCountMax 2' }
      notify: Restart SSH

    # -------------------------------------------------------------------------
    # 6. Ansible API token
    # -------------------------------------------------------------------------
    - name: Create ansible system user (PAM)
      ansible.builtin.user:
        name: ansible
        shell: /bin/bash
        create_home: true
        state: present

    # pveum privilege list cannot be split without altering the command
    # yamllint disable rule:line-length
    - name: Create Proxmox role for Ansible with required privileges
      ansible.builtin.command: >
        pveum role add AnsibleRole
        --privs "Datastore.AllocateSpace,Datastore.Audit,Pool.Allocate,Sys.Audit,Sys.Console,Sys.Modify,VM.Allocate,VM.Audit,VM.Clone,VM.Config.CDROM,VM.Config.CPU,VM.Config.Cloudinit,VM.Config.Disk,VM.Config.HWType,VM.Config.Memory,VM.Config.Network,VM.Config.Options,VM.Migrate,VM.Monitor,VM.PowerMgmt,SDN.Use"
      failed_when: false  # role may already exist
      changed_when: false
    # yamllint enable rule:line-length

    - name: Add ansible user to Proxmox
      ansible.builtin.command: pveum user add {{ pve_api_user }} --comment "Ansible automation user"
      failed_when: false
      changed_when: false

    - name: Assign AnsibleRole to ansible user on root path
      ansible.builtin.command: pveum acl modify / --user {{ pve_api_user }} --role AnsibleRole
      changed_when: false

    - name: Create API token for ansible user
      ansible.builtin.command: >
        pveum user token add {{ pve_api_user }} {{ pve_api_token_name }}
        --privsep 0 --output-format json
      register: pve_token_output
      changed_when: pve_token_output.rc == 0
      failed_when: false  # token may already exist on re-run

    - name: Display API token (save this — shown once)
      ansible.builtin.debug:
        msg: "{{ pve_token_output.stdout | from_json }}"
      when:
        - pve_token_output.rc == 0
        - pve_token_output.stdout is defined
        - pve_token_output.stdout | length > 0

    # -------------------------------------------------------------------------
    # 7. Reboot if kernel was installed
    # -------------------------------------------------------------------------
    - name: Reboot into Proxmox kernel
      ansible.builtin.reboot:
        msg: "Rebooting into Proxmox VE kernel"
        reboot_timeout: 300
      when: pve_kernel_installed.changed

  handlers:
    - name: Restart SSH
      ansible.builtin.service:
        name: ssh
        state: restarted
