---
modules:
  icmp:
    prober: icmp
    timeout: 5s

  dns_udp:
    prober: dns
    timeout: 5s
    dns:
      transport_protocol: udp
      query_name: "example.com"
      query_type: "A"
      valid_rcodes: [NOERROR]

  # Deliberately queries a domain with broken DNSSEC signatures.
  # A validating chain returns SERVFAIL -> probe SUCCEEDS.
  # NOERROR here = validation silently disabled somewhere in the chain.
  dns_dnssec_enforced:
    prober: dns
    timeout: 8s
    dns:
      transport_protocol: udp
      query_name: "dnssec-failed.org"
      query_type: "A"
      valid_rcodes: [SERVFAIL]

  tcp_connect:
    prober: tcp
    timeout: 5s

  http_2xx:
    prober: http
    timeout: 8s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: [200, 204, 301, 302]
