# Minimal on-demand Grafana. Datasource: http://127.0.0.1:9091
[server]
http_addr = 192.168.0.105
http_port = 3002

[security]
admin_user = admin
# GF_SECURITY_ADMIN_PASSWORD comes from /etc/grafana/grafana.env,
# loaded by the unit's EnvironmentFile and created by the installer.
disable_gravatar = true
cookie_secure = false           # plain HTTP on LAN; flip if fronted by TLS later
cookie_samesite = strict

[users]
allow_sign_up = false

[auth.anonymous]
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false

[paths]
data = /var/lib/grafana
logs = /var/lib/grafana/log
plugins = /var/lib/grafana/plugins

[plugins]
# Bundled plugins are pinned to the versions shipped in the kit's
# verified Grafana tarball, by decision (2026-11-11). The grafana unit
# runs ProtectSystem=strict, which leaves the bundled-plugins tree
# (/opt/grafana/data/plugins-bundled) read-only, so Grafana's startup
# auto-update of preinstalled plugins cannot land there and only logs
# an unlinkat read-only error (seen live 2026-11-02 for prometheus,
# 2026-11-11 for zipkin). preinstall_auto_update = false records the
# pin and stops the attempt. Bundled plugin versions move only when
# the kit's GRAFANA_VERSION pin is bumped.
preinstall_auto_update = false
