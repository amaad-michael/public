# password-policy-group.yml
# Enforce password aging and a password-quality baseline across a fleet.
#
# Usage:
#   ansible-playbook -i inv password-policy-group.yml -e target_group=webservers
#   ansible-playbook -i inv password-policy-group.yml -e target_group=webservers \
#     -e "username=deploy" -e maxdays=60 -e minlen=14
# Limit to one host: append -l host01
#
# Variables:
#   username   (optional) single user; default applies to all real users (UID>=1000)
#   maxdays    (optional, default 90)
#   mindays    (optional, default 1)
#   warndays   (optional, default 7)
#   minlen     (optional, default 12)
#   skip_pwquality (optional, default false) apply aging only, leave pwquality alone

- name: Enforce password policy
  # ansible-playbook -i inv password-policy-group.yml -e target_group=webservers -l host01
  hosts: "{{ target_group | default('all') }}"
  become: true

  vars:
    maxdays: 90
    mindays: 1
    warndays: 7
    minlen: 12
    skip_pwquality: false

  tasks:
    - name: Fail cleanly on unsupported OS families
      ansible.builtin.fail:
        msg: "Unsupported OS family {{ ansible_facts['os_family'] }}; only RedHat and Debian families are supported."
      when: ansible_facts['os_family'] not in ['RedHat', 'Debian']

    - name: Discover real users
      ansible.builtin.shell: |
        awk -F: '($3 >= 1000) && ($7 !~ /(nologin|false)$/) {print $1}' /etc/passwd
      args:
        executable: /bin/bash
      register: real_users
      changed_when: false

    - name: Set target user list
      ansible.builtin.set_fact:
        policy_users: "{{ [username] if username is defined else real_users.stdout_lines }}"

    - name: Apply password aging
      ansible.builtin.command: >
        chage -M {{ maxdays }} -m {{ mindays }} -W {{ warndays }} {{ item }}
      loop: "{{ policy_users }}"
      register: chage_out
      changed_when: false

    - name: Ensure pwquality package is installed
      ansible.builtin.package:
        name: "{{ 'libpam-pwquality' if ansible_facts['os_family'] == 'Debian' else 'libpwquality' }}"
        state: present
      when: not (skip_pwquality | bool)

    - name: Write password-quality baseline
      ansible.builtin.copy:
        dest: /etc/security/pwquality.conf.d/toolkit.conf
        content: |
          # Managed by linux-admin-toolkit password-policy (do not hand-edit).
          minlen = {{ minlen }}
          dcredit = -1
          ucredit = -1
          lcredit = -1
          ocredit = -1
          retry = 3
        mode: "0644"
      when: not (skip_pwquality | bool)
