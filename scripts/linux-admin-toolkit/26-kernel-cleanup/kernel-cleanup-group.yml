# kernel-cleanup-group.yml
# Remove old kernels across a fleet, keeping the N most recent (default 2).
#
# Usage:
#   ansible-playbook -i inv kernel-cleanup-group.yml -e target_group=webservers
#   ansible-playbook -i inv kernel-cleanup-group.yml -e target_group=webservers -e keep=3
# Limit to one host: append -l host01
# Dry-run: append --check (module check-mode; nothing is removed)
#
# Variables:
#   keep (default 2)  number of most-recent kernels to keep
#
# Safety: the running kernel (ansible_facts['kernel']) is always protected;
# the play aborts if it would ever land in the removal set.

- name: Remove old kernels, keeping the N most recent
  # ansible-playbook -i inv kernel-cleanup-group.yml -e target_group=webservers -l host01
  hosts: "{{ target_group | default('all') }}"
  become: true

  vars:
    keep: 2

  tasks:
    - name: Fail cleanly on unsupported OS families
      ansible.builtin.fail:
        msg: "Unsupported OS family {{ ansible_facts['os_family'] }}; only RedHat and Debian families are supported."
      when: ansible_facts['os_family'] not in ['RedHat', 'Debian']

    - name: RedHat | list installed kernel versions, newest first
      ansible.builtin.shell: |
        rpm -q --queryformat '%{VERSION}-%{RELEASE}\n' kernel 2>/dev/null | sort -rV
      register: rhel_kernel_versions
      changed_when: false
      failed_when: false
      when: ansible_facts['os_family'] == 'RedHat'

    - name: RedHat | compute old kernel package names to remove
      ansible.builtin.shell: |
        set -euo pipefail
        running_vr="$(uname -r | sed 's/\.[^.]*$//')"
        echo "running_vr=$running_vr" >&2
        keep_n="{{ keep }}"
        i=0
        while read -r v; do
          [ -n "$v" ] || continue
          i=$((i + 1))
          # keep newest $keep_n, always protect the running kernel
          if [ "$i" -le "$keep_n" ] || [ "$v" = "$running_vr" ]; then
            continue
          fi
          if [ "$v" = "$running_vr" ]; then
            echo "ABORT: running kernel $running_vr in removal set" >&2
            exit 1
          fi
          for p in kernel kernel-core kernel-modules kernel-modules-core kernel-modules-extra; do
            rpm -q "$p-$v" >/dev/null 2>&1 && echo "$p-$v"
          done
        done <<'VERSIONS'
        {{ rhel_kernel_versions.stdout }}
        VERSIONS
      args:
        executable: /bin/bash
      register: rhel_kernel_remove
      changed_when: false
      when:
        - ansible_facts['os_family'] == 'RedHat'
        - rhel_kernel_versions.stdout | length > 0

    - name: RedHat | remove old kernel packages
      ansible.builtin.dnf:
        name: "{{ rhel_kernel_remove.stdout_lines }}"
        state: absent
      when:
        - ansible_facts['os_family'] == 'RedHat'
        - (rhel_kernel_remove.stdout_lines | default([])) | length > 0

    - name: Debian | list installed kernel images, newest first
      ansible.builtin.shell: |
        dpkg-query -W -f='${Package}\n' 'linux-image-[0-9]*' 2>/dev/null | sort -rV
      register: debian_kernel_images
      changed_when: false
      failed_when: false
      when: ansible_facts['os_family'] == 'Debian'

    - name: Debian | compute old kernel images to purge
      ansible.builtin.shell: |
        set -euo pipefail
        running_img="linux-image-$(uname -r)"
        echo "running_img=$running_img" >&2
        keep_n="{{ keep }}"
        i=0
        while read -r img; do
          [ -n "$img" ] || continue
          i=$((i + 1))
          if [ "$i" -le "$keep_n" ] || [ "$img" = "$running_img" ]; then
            continue
          fi
          if [ "$img" = "$running_img" ]; then
            echo "ABORT: running kernel image $running_img in removal set" >&2
            exit 1
          fi
          echo "$img"
        done <<'IMAGES'
        {{ debian_kernel_images.stdout }}
        IMAGES
      args:
        executable: /bin/bash
      register: debian_kernel_remove
      changed_when: false
      when:
        - ansible_facts['os_family'] == 'Debian'
        - debian_kernel_images.stdout | length > 0

    - name: Debian | purge old kernel images
      ansible.builtin.apt:
        name: "{{ debian_kernel_remove.stdout_lines }}"
        state: absent
        purge: true
      when:
        - ansible_facts['os_family'] == 'Debian'
        - (debian_kernel_remove.stdout_lines | default([])) | length > 0

    - name: Report what was removed
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: removed
          {{ ( ((rhel_kernel_remove.stdout_lines | default([])) + (debian_kernel_remove.stdout_lines | default([]))) | join(', ') ) or '(nothing — already within keep limit)' }}.
          Running kernel was protected in all cases.
