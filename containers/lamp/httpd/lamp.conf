# LAMP stack — PHP wiring for the web service.
# Included at the end of httpd.conf. PHP requests are proxied to
# PHP-FPM in the php service (FastCGI on port 9000, lamp-net network).
# Both containers mount the docroot at /var/www/html, so the
# SCRIPT_FILENAME httpd passes is the path PHP-FPM reads.

ServerName localhost

DirectoryIndex index.php index.html

<FilesMatch \.php$>
    SetHandler "proxy:fcgi://php:9000"
</FilesMatch>
