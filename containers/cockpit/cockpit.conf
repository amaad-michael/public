# Cockpit bastion configuration for the containers/cockpit stack.
# Same settings as the image's built-in /container/default-bastion.conf
# (what the entrypoint would symlink in if this file were not mounted),
# kept in the repo so the console's posture is reviewable:
# - RequireHost: the login page always asks which host to connect to;
#   there is no local machine to manage inside the container.
# - Authentication is delegated to /container/cockpit-auth-ssh-key:
#   the user logs in with their own credentials for the target host
#   over SSH. No passwords or keys live in this stack.
[WebService]
ProtocolHeader = X-Forwarded-Proto
LoginTitle = Cockpit Bastion
RequireHost = true

[Negotiate]
action = none

[Basic]
Command = /container/cockpit-auth-ssh-key

[Ssh-Login]
Command = /container/cockpit-auth-ssh-key
