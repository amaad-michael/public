---
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - standby-alertmanager:9093

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['standby-prometheus:9090']

  - job_name: 'grafana'
    static_configs:
      - targets: ['standby-grafana:3000']

  - job_name: 'traefik'
    static_configs:
      - targets: ['standby-traefik:8080']

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['standby-alertmanager:9093']

  - job_name: 'headscale'
    static_configs:
      - targets: ['standby-headscale:9091']

  - job_name: 'uptime-kuma'
    static_configs:
      - targets: ['standby-uptime-kuma:3001']
