; Gitea configuration for the mirror stack.
; Mirrors the [server] seed in scripts/provisioning/install-gitea.sh.
; Secrets (SECRET_KEY, INTERNAL_TOKEN) and the server DOMAIN / ROOT_URL
; are injected from the host-side .env through compose environment
; variables (GITEA__security__*, GITEA__server__*), never written here.

[server]
PROTOCOL         = http
HTTP_PORT        = 3000
START_SSH_SERVER = true
SSH_PORT         = 2222
SSH_LISTEN_PORT  = 2222
DISABLE_SSH      = false

[database]
DB_TYPE = sqlite3

[security]
; The web installer is disabled: first admin is created with the CLI
; (see README.md), matching the tighten-after-setup model of the
; bare-metal scripts.
INSTALL_LOCK = true

[service]
DISABLE_REGISTRATION = true
