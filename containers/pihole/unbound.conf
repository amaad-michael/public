server:
  # No chroot: the madnuttah build chroots into
  # /usr/local/unbound/unbound.d by default, and this stack drops
  # SYS_CHROOT (cap_drop: ALL), so the daemon died with "unable to
  # chroot ... Operation not permitted" on neo1 (2026-11-11). The
  # container is the isolation boundary.
  chroot: ""

  # Listening interface
  interface: 0.0.0.0
  port: 5335
  do-ip4: yes
  do-ip6: no
  do-udp: yes
  do-tcp: yes

  # Privacy and security
  hide-identity: yes
  hide-version: yes
  identity: "DNS"
  version: "1.0"

  # Performance
  num-threads: 2
  prefetch: yes
  prefetch-key: yes

  # Cache
  cache-min-ttl: 300
  cache-max-ttl: 86400

  # Security hardening
  disable-dnssec-lame-check: no
  harden-glue: yes
  harden-dnssec-stripped: yes
  harden-below-nxdomain: yes
  # harden-referral-path is deliberately NOT set: together with
  # harden-algo-downgrade it breaks DS validation (bisected live on
  # neo1, 2026-11-11: the pair fails with "no DS", each flag alone
  # passes, and the other three harden flags pass in every tested
  # combination). harden-algo-downgrade is kept on its own.
  harden-algo-downgrade: yes
  use-caps-for-id: yes

  # Query protection
  unwanted-reply-threshold: 10000
  do-not-query-localhost: no

  # Rate limiting
  ratelimit: 1000

  # DNSSEC (Aligned with madnuttah/unbound compilation paths)
  auto-trust-anchor-file: "/usr/local/unbound/iana.d/root.key"
  trust-anchor-signaling: yes
  root-key-sentinel: yes

  # Logging (zero-logging/OpSec enforced)
  logfile: ""
  log-queries: no
  log-replies: no
  log-servfail: yes
  log-local-actions: yes

  # Access control (Strictly limit to Docker bridge and localhost)
  access-control: 127.0.0.0/8 allow
  access-control: 172.20.0.0/16 allow
  access-control: 0.0.0.0/0 deny

  # Local zones
  local-zone: "localhost." static
  local-data: "localhost. 10800 IN A 127.0.0.1"
  local-zone: "pi.hole." static
  local-data: "pi.hole. 10800 IN A 172.20.0.2"
  local-zone: "local." transparent

  # Socket options
  so-reuseport: yes

  # Timeouts
  edns-tcp-keepalive: yes
  edns-tcp-keepalive-timeout: 120
