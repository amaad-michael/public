# Healthcheck-only Unbound config. The unbound service's healthcheck
# in docker-compose.yml runs unbound-host against this file; the
# daemon itself runs unbound.conf.
#
# Why this file exists: the daemon config uses
# auto-trust-anchor-file, and unbound-host against it must write an
# autotrust temp file beside the anchor before it can resolve. This
# stack drops ALL capabilities, so the healthcheck's root has no
# CAP_DAC_OVERRIDE and cannot write in the _unbound-owned anchor
# directory (/usr/local/unbound/iana.d): the check fataled with
# "could not open autotrust file for writing" and the container
# stayed unhealthy forever on neo1 (2026-11-11), while the identical
# command run as uid 1000 resolved fine. trust-anchor-file is the
# read-only form: the anchor is loaded and never written, so the
# check needs no write anywhere.
server:
  chroot: ""
  trust-anchor-file: "/usr/local/unbound/iana.d/root.key"
