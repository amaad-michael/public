server:
  # Listening interface
  interface: 172.20.0.3
  port: 5335
  do-ip4: yes
  do-ip6: no
  do-udp: yes
  do-tcp: yes

  # Privacy and security
  hide-identity: yes
  hide-version: yes
  identity: "DNS"
  version: "1.0"

  # Performance
  num-threads: 2
  prefetch: yes
  prefetch-key: yes

  # Cache
  cache-min-ttl: 300
  cache-max-ttl: 86400
  neg-cache-enable: yes

  # Security hardening
  disable-dnssec-lame-check: no
  harden-glue: yes
  harden-dnssec-stripped: yes
  harden-below-nxdomain: yes
  harden-referral-path: yes
  harden-algo-downgrade: yes
  use-caps-for-id: yes

  # Query protection
  unwanted-reply-threshold: 10000
  do-not-query-localhost: no

  # Rate limiting
  ratelimit: 1000
  ratelimit-slop: 100

  # DNSSEC
  auto-trust-anchor-file: "/opt/unbound/etc/unbound/root.key"
  trust-anchor-signaling: yes
  root-key-sentinel: yes

  # Logging (minimal for performance)
  logfile: ""
  log-queries: no
  log-replies: no
  log-servfail: yes
  log-local-actions: yes

  # Access control (local only)
  access-control: 127.0.0.1 allow
  access-control: 172.20.0.0/16 allow
  access-control: 192.168.0.0/24 allow
  access-control: 0.0.0.0/0 deny

  # Local zones
  local-zone: "localhost." static
  local-data: "localhost. 10800 IN A 127.0.0.1"
  local-zone: "pi.hole." static
  local-data: "pi.hole. 10800 IN A 172.20.0.2"
  local-zone: "local." transparent

  # Recursion control
  recursion: yes
  recursion-protected: yes
  recursive-only: yes

  # Socket options (0 = system default, distroless-safe)
  so-reuseport: yes

  # Timeouts
  outgoing-num-tcp: 10
  incoming-num-tcp: 10
  edns-tcp-keepalive: yes
  edns-tcp-keepalive-timeout: 120
