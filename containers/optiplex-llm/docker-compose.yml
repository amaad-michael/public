---
# optiplex-llm — a single portable llama.cpp inference server.
# Container mirror of the Ansible OptiPlex deployment:
#   ansible/playbooks/llm/optiplex-llm-setup-v2.1.yml
#
# The playbook compiles llama.cpp from source on one apt-based x86-64
# desktop, downloads a GGUF model, and serves it with a systemd unit.
# This stack runs the same server from the official llama.cpp image
# instead: no build, no systemd, no host assumptions — it runs on any
# x86_64 Docker host with a bare `docker compose up -d`.
#
# First start downloads the default model (Llama-3.2-3B-Instruct
# Q4_K_M, the playbook's default preset) into the named volume and
# verifies it against the pinned SHA-256 below; every later start
# re-verifies before serving and reuses the volume copy. The stack
# refuses to serve a model that fails verification.
#
# Every knob has a shipped default, so no .env is required. Copy
# .env.example to .env only to change something (model preset, host
# port, LAN exposure with an API key, sampling defaults).

services:
  # Inference server — the OptiPlex role (llama-server, port 8080)
  optiplex-llm:
    image: ghcr.io/ggml-org/llama.cpp:server-b11681
    container_name: optiplex-llm
    # The image entrypoint is /app/llama-server itself; the stack
    # replaces it with its own script (bind-mounted read-only below)
    # so the model is fetched and verified before the server starts.
    # The script ends by exec'ing /app/llama-server from /app, the
    # image's WorkingDir — required because the launcher's RUNPATH
    # resolves libllama-server-impl.so relative to the working dir.
    entrypoint: ["/bin/sh", "/optiplex-llm/entrypoint.sh"]
    working_dir: /app
    environment:
      MODEL_URL: ${MODEL_URL:-https://huggingface.co/bartowski/Llama-3.2-3B-Instruct-GGUF/resolve/main/Llama-3.2-3B-Instruct-Q4_K_M.gguf}
      MODEL_NAME: ${MODEL_NAME:-Llama-3.2-3B-Instruct-Q4_K_M}
      MODEL_SHA256: ${MODEL_SHA256:-6c1a2b41161032677be168d354123594c0e6e67d2b9227c84f296ad037c728ff}
      CTX_SIZE: ${CTX_SIZE:-4096}
      MLOCK: ${MLOCK:-1}
      TEMP: ${TEMP:-0.2}
      TOP_P: ${TOP_P:-0.95}
      MIN_P: ${MIN_P:-0.01}
      THREADS: ${THREADS:-0}
      API_KEY: ${API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      # Loopback only by default, matching the playbook's bind_addr.
      # Set HOST_BIND=0.0.0.0 (and an API_KEY) to expose on the LAN —
      # see README.md before doing so.
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-8080}:8080"
    volumes:
      - ./entrypoint.sh:/optiplex-llm/entrypoint.sh:ro
      - optiplex_llm_models:/models
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    ulimits:
      # The playbook's unit sets LimitMEMLOCK=infinity so the model
      # can be locked in RAM (--load-mode mmap+mlock, the current
      # form of the playbook-era --mlock flag).
      memlock: -1
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 6G
        reservations:
          cpus: '1'
          memory: 3G
    healthcheck:
      # The image's own baked-in healthcheck.
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    restart: unless-stopped

volumes:
  optiplex_llm_models:
    name: optiplex_llm_models
