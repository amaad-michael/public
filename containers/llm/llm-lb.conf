# llm-lb.conf
# nginx reverse proxy / load balancer for llama.cpp inference nodes.
# Container mirror of ansible/playbooks/llm/llm-lb.conf.j2 — the upstream
# and proxy design is the Jinja original's; the backends are the compose
# services, and the listen port moves from 80 to 8080 so the LB can run
# unprivileged behind the published host port.
# Uses least_conn to avoid sending heavy requests to the lighter board.

upstream llm_pool {
    least_conn;

    server llm-heavy:8080;  # 4gb-heavy
    server llm-light:8080;  # 2gb-light
}

server {
    listen 8080;
    server_name _;

    # Health check endpoint — returns LB status without hitting a backend
    location /lb-health {
        access_log off;
        return 200 'llm-lb ok\n';
        add_header Content-Type text/plain;
    }

    # Proxy all inference traffic to the pool
    location / {
        proxy_pass http://llm_pool;

        # Inference takes time — do not let nginx time out mid-generation
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream over HTTP/1.1 — llama-server answers /completion with
        # chunked event streams, which the nginx default (HTTP/1.0 with
        # Connection: close) would de-chunk and buffer
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Disable buffering — stream tokens as they generate
        proxy_buffering off;
        proxy_cache off;
    }
}
