# Minimal on-demand Grafana. Datasource: http://127.0.0.1:9091
[server]
http_addr = 192.168.0.105
http_port = 3002

[security]
admin_user = admin
# Password injected via GF_SECURITY_ADMIN_PASSWORD env (from .env)
disable_gravatar = true
cookie_secure = false           # plain HTTP on LAN; flip if fronted by TLS later
cookie_samesite = strict

[users]
allow_sign_up = false

[auth.anonymous]
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false

[paths]
data = /var/lib/grafana
logs = /var/lib/grafana/log
plugins = /var/lib/grafana/plugins

[plugins]
# Deliberate pin (2026-11-11): bundled plugins stay at the versions
# shipped in the pinned image; they move only when GRAFANA_TAG is
# bumped. The container runs read_only, so the bundled tree in the
# image layer is read-only to the service, exactly as under the
# native kit's ProtectSystem=strict: Grafana's startup auto-updater
# stops a bundled plugin before updating it, the update fails with
# "unlinkat .../plugins-bundled/<id>: read-only file system", and the
# plugin can stay unregistered for the whole session (proven live on
# the native form 2026-11-11, where it killed the prometheus plugin
# and Grafana's only datasource stopped resolving in the UI).
preinstall_auto_update = false
