---
route:
  receiver: ntfy
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: ntfy
    webhook_configs:
      # `template=alertmanager` requires a recent ntfy release (native
      # Alertmanager payload rendering). VERIFY your pinned ntfy supports it;
      # fallback: drop the query param — alerts arrive as raw JSON (ugly, works).
      - url: "http://127.0.0.1:8081/alerts?template=alertmanager"
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/ntfy.token
